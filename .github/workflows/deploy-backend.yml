name: Deploy Backend to Hostinger

# Pushes backend/ to the live API on every push to main.
#
# WHY server-dir LOOKS ODD: Hostinger drops FTP users at /home/uXXXXXXXX/, and
# the site is served from domains/<domain>/public_html — NOT from a public_html
# at that home root. Using "public_html/api/carelink_api/" uploaded 500 files
# successfully into a folder nothing serves, while the real one sat empty.
#
# The path below is the one proven by a PHP error trace from the live server:
#   /home/u709359174/domains/carelink-ph.com/public_html/api/carelink_api/shared/auth_codes.php
# Everything after /home/u709359174/ is what belongs here.

on:
  push:
    branches:
      - main
  # Lets you re-run a deploy from the Actions tab without making an empty commit.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Sync Backend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: ./
          port: 21
          protocol: ftp
          timeout: 180000
          # Never touch these on the server. config.local.php holds the DB, mail
          # and PayMongo credentials and is gitignored, so it exists ONLY on the
          # server — losing it takes the whole API down. uploads/ is
          # user-submitted documents and photos, which exist nowhere else.
          # test_*.php are throwaway diagnostics that must never ship.
          # database/ is SQL dumps — current.sql alone carries every real
          # email and bcrypt hash in the system, and local-dir is the web
          # root, so uploading it published them at /database/current.sql
          # to anyone who guessed the name. Nothing on the server reads
          # these files; they are local development artifacts.
          exclude: |
            **/.git*
            **/.git*/**
            **/config.local.php
            **/uploads/**
            **/test_*.php
            **/database/**

      # New tables are created by ensure_*() helpers that run only when the
      # feature needing them is first opened. That leaves a freshly deployed
      # server with whatever schema its visitors happened to trigger — and any
      # endpoint that reads a table without including its ensure_* file gets an
      # "unknown table" error, which under PHP 8.1's throwing mysqli surfaces as
      # a blank screen rather than a missing section.
      #
      # backend/migrate.php runs every one of them in a single pass, so the
      # schema is complete when the deploy finishes instead of whenever someone
      # clicks the right thing. It only ever CREATEs, so re-running is a no-op.
      - name: 🗄️ Update database schema
        env:
          # NOTE: NOT derivable from server-dir above. That is a filesystem
          # path; api.carelink-ph.com is a subdomain mapped onto .../public_html/api/,
          # so the public URL has no /api/ segment. Deriving it from the path 404s.
          # Override with a repository secret if the domain moves. MIGRATE_TOKEN
          # must match backend/config.local.php on the server, or this is refused.
          MIGRATE_URL: ${{ secrets.MIGRATE_URL || 'https://api.carelink-ph.com/carelink_api' }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
        run: |
          if [ -z "$MIGRATE_TOKEN" ]; then
            echo "::warning::MIGRATE_TOKEN secret is not set — schema was NOT updated."
            echo "The file deploy succeeded. New tables will still appear lazily, the first"
            echo "time someone opens the feature that needs them. To make it automatic, add"
            echo "MIGRATE_TOKEN to your GitHub secrets and to backend/config.local.php."
            exit 0
          fi
          echo "Running migrations against $MIGRATE_URL"
          # --fail-with-body so a non-2xx still prints migrate.php's JSON, which
          # names the migration that failed. A bare --fail would hide it.
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$MIGRATE_URL/migrate.php" \
            -H "X-CareLink-Migrate-Token: $MIGRATE_TOKEN"
