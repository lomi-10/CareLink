name: Deploy Backend to Hostinger

on:
  push:
    branches:
      - main  # Runs automatically every time you push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Sync Backend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/                     # Takes ONLY files inside your backend folder
          server-dir: public_html/api/carelink_api/ # Drops them directly into this folder