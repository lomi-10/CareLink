name: Deploy Backend to Hostinger

on:
  push:
    branches:
      - main  # Adjust to 'master' if your main branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Sync Backend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: public_html/api/carelink_api/
          port: 21            # Explicitly sets standard FTP port
          protocol: ftp       # Prevents FTPS handshake timeouts
          timeout: 180000     # Extends connection timeout to 3 minutes